<script>
        // Новый ключ сохранения, чтобы полностью очистить старые забагованные предметы
        let state = {balance:500,inventory:[],marketLots:[],myId:Math.floor(10000+Math.random()*90000),totalEarned:0,casesOpened:0,friendsList:[],nickname:""};
        const ranks = ["Silver I", "Silver Elite", "Gold Nova I", "Master Guardian", "Legendary Eagle", "The Legend"];

        const pool = {
            weapon:[
                {name:"P350 | Nano",r:"Ширпотреб",p:20,icon:"🔫",c:"rare-common"},{name:"Glock | Oiled",r:"Запрещенное",p:35,icon:"🔫",c:"rare-rare"},
                {name:"Glock | Fade",r:"Засекреченное",p:95,icon:"🔫",c:"rare-mythical"},{name:"Desert Eagle | Sparkle",r:"Засекреченное",p:80,icon:"🔫",c:"rare-mythical"},
                {name:"Desert Eagle | Ocean Drive",r:"Тайное",p:210,icon:"🔫",c:"rare-legendary"},{name:"AK-47 | Elite Build",r:"Запрещенное",p:50,icon:"🔱",c:"rare-rare"},
                {name:"AK-47 | Gold Sparkle",r:"Тайное",p:450,icon:"🔱",c:"rare-ancient"},{name:"M4A1-S | Emerald Marble",r:"Тайное",p:550,icon:"⚔️",c:"rare-ancient"},
                {name:"AWP | Tiger Silver",r:"Тайное",p:650,icon:"🎯",c:"rare-ancient"}
            ],
            knife:[
                {name:"Karambit | Doppler",r:"Нож",p:1600,icon:"🔪",c:"rare-knife"},{name:"Butterfly | Fade",r:"Нож",p:1850,icon:"🦋",c:"rare-knife"},{name:"M9 | Crimson Web",r:"Нож",p:1400,icon:"🗡️",c:"rare-knife"}
            ],
            charm:[
                {name:"Брелок | Котэ",r:"Брелок",p:40,icon:"🧸",c:"rare-rare"},{name:"Брелок | Череп",r:"Брелок",p:80,icon:"💀",c:"rare-mythical"},{name:"Брелок | Золотой Куб",r:"Брелок",p:200,icon:"🟩",c:"rare-ancient"}
            ]
        };

        let gInt,tInt,score=0,time=15,diff='easy',isRun=false,tx=0,ty=0,dx=2,dy=2,curIdx,curSrc,isRolling=false;
        let craftSlots = [null,null,null,null,null,null,null,null,null,null];
        const $=id=>document.getElementById(id);
        const save=()=>localStorage.setItem('nans_v5_ultimate_fix',JSON.stringify(state));

        const load=()=>{
            let s=localStorage.getItem('nans_v5_ultimate_fix');
            if(s) state=Object.assign(state,JSON.parse(s));
            if(!state.nickname) state.nickname = "Игрок №" + state.myId;
            if(isNaN(state.balance) || state.balance === null) state.balance = 500;
            if(isNaN(state.totalEarned)) state.totalEarned = 0;
            if(isNaN(state.casesOpened)) state.casesOpened = 0;
            $('balance-val').innerText=state.balance;
        };

        function switchScreen(n){
            document.querySelectorAll('.screen').forEach(s=>s.style.display='none');
            document.querySelectorAll('nav .nav-btn').forEach(b=>b.classList.remove('active'));
            let ts = $(`screen-${n}`); if(ts) ts.style.display='block';
            if(event && event.target && event.target.classList) event.target.classList.add('active');
            if(n==='inventory') drawInv();
            if(n==='market') drawMarket();
            if(n==='friends') drawFriends();
            if(n==='profile') drawProfile();
        }

        function setDifficulty(d){if(isRun)return;diff=d;document.querySelectorAll('#screen-game .nav-btn').forEach(b=>b.style.background='');$(`diff-${d}`).style.background='var(--accent)'}

        function startGame(){
            if(isRun) return; isRun=true; score=0; time=15; $('game-score').innerText=score; $('game-timer').innerText=time;
            $('start-game-btn').disabled=true; $('target').style.display='block'; dx=dy=diff=='easy'?2:(diff=='medium'?5:8);
            tInt=setInterval(()=>{
                let c=$('game-canvas-container'); tx+=dx; ty+=dy; if(tx<=0||tx>=c.clientWidth-45)dx=-dx; if(ty<=0||ty>=c.clientHeight-45)dy=-dy;
                $('target').style.left=tx+'px';$('target').style.top=ty+'px'
            },16);
            gInt=setInterval(()=>{time--; $('game-timer').innerText=time; if(time<=0){clearInterval(gInt);clearInterval(tInt);isRun=false;$('target').style.display='none';$('start-game-btn').disabled=false;alert('Время вышло!')}},1000);
        }

        function hitTarget(){
            if(!isRun)return; score++; let r=diff=='easy'?50:(diff=='medium'?100:250); state.balance+=r; state.totalEarned+=r;
            $('game-score').innerText=score; $('balance-val').innerText=state.balance; save();
            tx=Math.random()*($('game-canvas-container').clientWidth-45); ty=Math.random()*($('game-canvas-container').clientHeight-45);
        }

        function buyCasePack(type, price){
            if(state.balance < price) return alert('Нет монет!'); state.balance -= price;
            let nameMap = {weapon:"📦 Кейс пушек", knife:"🔪 Кейс ножей", charm:"🧸 Набор брелков"};
            state.inventory.push({id:'c'+Date.now()+Math.random(), isCase:true, caseType:type, name:nameMap[type], icon:type=='weapon'?'📦':(type=='knife'?'🔪':'🧸'), p:price, c:"rare-common"});
            $('balance-val').innerText = state.balance; save(); alert('Кейс добавлен в инвентарь!');
        }

        function openCase(caseIdx) {
            if(isRolling) return; isRolling = true; let caseItem = state.inventory[caseIdx]; let type = caseItem.caseType;
            state.inventory.splice(caseIdx, 1); state.casesOpened++; closePreview();
            let tr = $('roulette-track'); $('roulette-view').style.display='block'; tr.innerHTML = ''; tr.style.transition='none'; tr.style.transform='translateX(0)';
            let itemsCount = 120, arr = [];
            for(let i=0; i<itemsCount; i++) { let item = pool[type][Math.floor(Math.random()*pool[type].length)]; arr.push(item); tr.innerHTML += `<div class="roulette-item ${item.c}"><div class="icon-box">${item.icon}</div><div>${item.name}</div></div>`; }
            let winIndex = 90; let winItem = Object.assign({}, arr[winIndex], {id: 'w'+Date.now()+Math.random()}); winItem.oldP = winItem.p;
            setTimeout(() => { tr.style.transition='transform 4.5s cubic-bezier(0.15, 0.85, 0.15, 1)'; let scrollAmount = -(winIndex * 152) + ($('roulette-view').clientWidth / 2) - 76; tr.style.transform = `translateX(${scrollAmount}px)`; }, 150);
            setTimeout(() => { isRolling = false; state.inventory.push(winItem); save(); alert(`🎉 Выпало: ${winItem.name}!`); drawInv(); }, 4700);
        }

        function drawInv(){ let g=$('inventory-grid'); g.innerHTML=state.inventory.length?'':'<p>Пусто</p>'; state.inventory.forEach((item,i)=>{g.innerHTML+=`<div class="skin-card ${item.c}"><div style="font-size:50px;">${item.icon}</div><b>${item.name}</b><button class="btn-buy" onclick="openPreview(${i},'inventory')">Осмотреть</button></div>`})}

        function drawMarket(){
            let g=$('market-lots-grid');
            if(state.marketLots.length === 0) {
                let types = ['weapon', 'knife', 'charm'];
                let rType = types[Math.floor(Math.random()*types.length)];
                let rItem = pool[rType][Math.floor(Math.random()*pool[rType].length)];
                state.marketLots.push({id:'m'+Date.now()+Math.random(), name:"[Бот] "+rItem.name, p: Math.floor(rItem.p * 0.9), oldP: rItem.p, icon: rItem.icon, c: rItem.c, r: rItem.r, isBot: true});
            }
            g.innerHTML='';
            state.marketLots.forEach((item,i)=>{g.innerHTML+=`<div class="skin-card ${item.c}"><div style="font-size:50px;">${item.icon}</div><b>${item.name}</b><p>${item.p}🪙</p><button class="btn-buy" style="background:#2196f3" onclick="openPreview(${i},'market')">Лот</button></div>`})
        }

        function drawFriends(){ let fl=$('friends-list'); fl.innerHTML=state.friendsList.length?'':'<p>Список пуст.</p>'; state.friendsList.forEach(f=>{fl.innerHTML+=`<div class="friend-row"><span>🟢 <b>${f.name}</b> (ID: ${f.id})</span><button class="nav-btn" style="padding:4px 10px;margin:0;" onclick="giftAction(${f.id})">🎁 Подарок</button></div>`})}

        function findFriendById(){ let id=parseInt($('friend-search-id').value); if(isNaN(id)) return alert("Введите ID!"); let found=state.friendsList.find(f=>f.id===id); if(found) return alert('Уже в списке!'); let names=["Gamer_Top","Sniper_Elite","Standoff_Pro","CS_Expert"]; let rName=names[Math.floor(Math.random()*names.length)]; state.friendsList.push({id:id,name:rName}); save(); drawFriends(); alert(`Добавлен: ${rName}`); }

        function giftAction(fId){
            let f=state.friendsList.find(f=>f.id===fId); let choice=prompt(`Подарок для ${f.name}:\n1 - Монеты\n2 - Скин`);
            if(choice=="1"){let sum=parseInt(prompt(`Сколько монет?`));if(isNaN(sum)||sum<=0||sum>state.balance)return;state.balance-=sum;$('balance-val').innerText=state.balance;save();alert('Отправлено!')}
            else if(choice=="2"){let filtered=state.inventory.filter(i=>!i.isCase);if(!filtered.length)return alert("Нет скинов!");let t="Номер скина:\n";filtered.forEach((item,idx)=>{t+=`${idx+1} - ${item.name}\n`});let sIdx=parseInt(prompt(t))-1;if(isNaN(sIdx)||sIdx<0||sIdx>=filtered.length)return;let realIdx=state.inventory.findIndex(item=>item.id===filtered[sIdx].id);state.inventory.splice(realIdx,1);save();alert(`Скин успешно отправлен другу ${f.name}!`);drawInv()}
        }

        // Полноценная функция профиля с отрисовкой кнопки
        function drawProfile(){
            $('prof-id').innerText=state.myId;
            $('prof-name-title').innerText=state.nickname;
            $('prof-total-earned').innerText=state.totalEarned;
            $('prof-cases-opened').innerText=state.casesOpened;
        }

        function changeNickname() {
            let newNick = prompt("Введите новый ник:", state.nickname);
            if(newNick && newNick.trim() !== "") { state.nickname = newNick.trim(); $('prof-name-title').innerText=state.nickname; save(); }
        }

        function openPreview(idx,src){
            curIdx=idx; curSrc=src; let item=src=='inventory'?state.inventory[idx]:state.marketLots[idx]; $('preview-title').innerText=item.name;
Используйте код с осторожностью.$('preview-rarity').innerText=item.isCase ? "Запечатанный предмет" : item.r; $('preview-price-info').innerText=Ценность: ${item.p} 🪙; let acts = $('preview-actions'); acts.innerHTML = '';if(src=='inventory'){if(item.isCase) { acts.innerHTML += <button class="nav-btn" style="background:#4caf50; width:100%; font-size:16px;" onclick="openCase(${idx})">Открыть кейс</button>; }else { acts.innerHTML += <button class="nav-btn" style="background:#e91e63;margin-bottom:5px;width:100%;" onclick="sell(${idx})">Продать системе</button><button class="nav-btn" style="background:#ff9800;width:100%;" onclick="toMarket(${idx})">На рынок</button>; }} else {if(item.isBot) { acts.innerHTML += <button class="nav-btn" style="background:#4caf50;width:100%;" onclick="buyFromMarket(${idx})">Купить лот</button>; }else { acts.innerHTML += <button class="nav-btn" style="background:#f44336;width:100%;" onclick="cancelMarket(${idx})">Снять с рынка</button>; }}$('preview-modal').style.display='flex';}function closePreview(){ $('preview-modal').style.display='none'; }function sell(i){let price = parseInt(state.inventory[i].p);if(!isNaN(price)) { state.balance += price; }state.inventory.splice(i,1);updateUI();}function toMarket(i) {let pr = parseInt(prompt("Введите вашу цену для продажи:")); if(isNaN(pr) || pr <= 0) return;let item = Object.assign({}, state.inventory[i]); // Фикс создания копии без массивовitem.oldP = item.p; item.p = pr;state.inventory.splice(i, 1);state.marketLots.push(item);updateUI();setTimeout(() => {let idx = state.marketLots.findIndex(l => l.id === item.id);if(idx !== -1) { state.marketLots.splice(idx, 1); state.balance += pr; alert(📢 Твой лот "${item.name}" купил бот! +${pr} 🪙); save(); $('balance-val').innerText=state.balance; }}, Math.floor(Math.random() * 15000) + 10000);}function buyFromMarket(i) {let item = state.marketLots[i]; if(state.balance < item.p) return alert("Недостаточно монет!");state.balance -= item.p; state.marketLots.splice(i,1); delete item.isBot; item.p = item.oldP;state.inventory.push(item); updateUI(); alert(🎉 Куплено: "${item.name}"!);}function cancelMarket(i) { let item = state.marketLots.splice(i, 1)[0]; item.p = item.oldP; state.inventory.push(item); updateUI(); }function updateUI(){ save(); closePreview(); $('balance-val').innerText=state.balance; drawInv(); drawMarket(); }document.addEventListener("DOMContentLoaded",()=>{load();setDifficulty('easy');});
